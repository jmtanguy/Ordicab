name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (example: v1.0.0-beta.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package_command: npm run package:mac
            artifact_name: macos-artifacts
          - os: windows-latest
            package_command: npm run package:win
            artifact_name: windows-artifacts

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the bundled ONNX models under resources/models/ so each release
      # build reuses them instead of pulling ~645 MB from huggingface.co. The
      # key includes scripts/prepare-models.mjs, so any change to the bundled
      # model list (ids, revisions, files) forces a fresh download on the
      # next run. The OS is scoped separately because cache entries are not
      # portable across runners, though the model files themselves are.
      - name: Cache embedded AI models
        uses: actions/cache@v4
        with:
          path: resources/models
          key: embedded-models-${{ runner.os }}-${{ hashFiles('scripts/prepare-models.mjs') }}
          restore-keys: |
            embedded-models-${{ runner.os }}-

      - name: Configure macOS signing and notarization env
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf "%s" "${{ secrets.APPLE_API_KEY_P8 }}" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"

      # Windows signing is optional for early-stage releases.
      # This step configures signing only when both Windows signing secrets are configured.
      - name: Configure Windows signing env (optional)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Windows signing: enabled"
          else
            echo "Windows signing: disabled (missing WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD)"
          fi

      - name: Build release artifacts
        run: ${{ matrix.package_command }}

      # Publish each platform's installers straight to the GitHub Release.
      # We deliberately skip the actions/upload-artifact round-trip: artifacts
      # only ever served as a hand-off to a separate publish job, yet they
      # consume the Actions storage quota (Electron output is 1000+ files per
      # platform). Release assets do not count against that quota. Both matrix
      # jobs target the same tag; action-gh-release creates the release if it
      # is missing and otherwise appends this job's files to it.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*setup.exe
            out/make/**/*.yml
            out/make/**/*.blockmap
